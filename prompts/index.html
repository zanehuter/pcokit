var currentInd = 'all';
var openCard = null;

var tagClass = {
  '客服回复': 'tag-g',
  '合规文件': 'tag-a',
  '员工培训': 'tag-p',
  '营销文案': 'tag-b',
  '知识科普': 'tag-p',
  '方案提案': 'tag-a'
};

function doFilter(ind, btn) {
  currentInd = ind;
  openCard = null;
  document.querySelectorAll('.fbtn').forEach(function(b) { b.classList.remove('on'); });
  btn.classList.add('on');
  renderAll();
}

function renderAll() {
  var freeData = PROMPTS.filter(function(p) {
    return p.free && (currentInd === 'all' || p.ind === currentInd);
  });
  var lockedData = PROMPTS.filter(function(p) {
    return !p.free && (currentInd === 'all' || p.ind === currentInd);
  });

  var freeArea = document.getElementById('freeArea');
  freeArea.innerHTML = '';

  if (freeData.length === 0) {
    freeArea.innerHTML = '<div style="padding:1.5rem;text-align:center;color:var(--muted);font-size:.85rem">该行业暂无免费预览，留邮箱获取完整版</div>';
  } else {
    freeData.forEach(function(p) {
      var globalIdx = PROMPTS.indexOf(p);
      var isOpen = (openCard === globalIdx);
      var tc = tagClass[p.scene] || 'tag-a';

      var card = document.createElement('div');
      card.className = 'pcard';

      var hd = document.createElement('div');
      hd.className = 'pcard-hd';
      hd.dataset.idx = globalIdx;

      var tags = document.createElement('div');
      tags.className = 'pcard-tags';
      tags.innerHTML = '<span class="tag ' + tc + '">' + p.scene + '</span><span class="tag tag-n">' + p.ind + '</span>';

      var titleEl = document.createElement('span');
      titleEl.className = 'pcard-title';
      titleEl.textContent = p.title;

      var arr = document.createElement('span');
      arr.className = 'pcard-arr' + (isOpen ? ' open' : '');
      arr.textContent = '▾';

      hd.appendChild(tags);
      hd.appendChild(titleEl);
      hd.appendChild(arr);

      hd.addEventListener('click', function() {
        var idx = parseInt(this.dataset.idx);
        openCard = (openCard === idx) ? null : idx;
        renderAll();
      });

      var body = document.createElement('div');
      body.className = 'pcard-body' + (isOpen ? ' show' : '');

      var lbl = document.createElement('div');
      lbl.className = 'pb-label';
      lbl.textContent = '提示词内容';

      var txt = document.createElement('div');
      txt.className = 'pb-content';
      txt.textContent = p.text;

      var acts = document.createElement('div');
      acts.className = 'pb-actions';

      var copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = '📋 复制提示词';
      copyBtn.dataset.idx = globalIdx;
      copyBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        var i = parseInt(this.dataset.idx);
        var btn = this;
        navigator.clipboard.writeText(PROMPTS[i].text).then(function() {
          btn.textContent = '✅ 已复制';
          btn.classList.add('ok');
          setTimeout(function() {
            btn.textContent = '📋 复制提示词';
            btn.classList.remove('ok');
          }, 2000);
        }).catch(function() {
          var ta = document.createElement('textarea');
          ta.value = PROMPTS[i].text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.textContent = '✅ 已复制';
          setTimeout(function() { btn.textContent = '📋 复制提示词'; }, 2000);
        });
      });

      acts.appendChild(copyBtn);
      body.appendChild(lbl);
      body.appendChild(txt);
      body.appendChild(acts);
      card.appendChild(hd);
      card.appendChild(body);
      freeArea.appendChild(card);
    });
  }

  var lockedArea = document.getElementById('lockedArea');
  lockedArea.innerHTML = '';
  lockedData.forEach(function(p) {
    var tc = tagClass[p.scene] || 'tag-a';
    var item = document.createElement('div');
    item.className = 'locked-item';
    item.innerHTML = '<span style="font-size:.95rem;flex-shrink:0">🔒</span><span class="locked-title">' + p.title + '</span><div class="locked-badges"><span class="tag ' + tc + '">' + p.scene + '</span><span class="tag tag-n">' + p.ind + '</span></div>';
    lockedArea.appendChild(item);
  });
}

function submitEmail(e) {
  e.preventDefault();
  var btn = e.target.querySelector('button');
  btn.textContent = '✓ 已提交，请查收邮件';
  btn.style.background = '#e8f5ec';
  btn.style.color = '#085041';
  setTimeout(function() {
    btn.textContent = '免费获取完整版 →';
    btn.style.background = '';
    btn.style.color = '';
    e.target.reset();
  }, 3000);
}

renderAll();
</script>
